apiVersion: apps/v1
kind: Deployment
metadata:
  name: readmission-risk-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: readmission-risk-api
  template:
    metadata:
      labels:
        app: readmission-risk-api
    spec:
      containers:
        - name: readmission-risk-api
          image: readmission-risk-api:optimized
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: readmission-risk-api
spec:
  selector:
    app: readmission-risk-api
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: LoadBalancer