global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/slo.rules.yml

scrape_configs:
  - job_name: readmission-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: application-cold-start
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
