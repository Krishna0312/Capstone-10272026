groups:
  - name: readmission-api-slo
    interval: 30s
    rules:
      - record: readmission_api:availability_ratio:7d
        expr: |
          sum(increase(http_requests_total{job="readmission-api", status!~"5.."}[7d]))
          /
          sum(increase(http_requests_total{job="readmission-api"}[7d]))
      - record: readmission_api:p95_latency_seconds:7d
        expr: |
          histogram_quantile(
            0.95,
            sum(increase(http_request_duration_highr_seconds_bucket{job="readmission-api"}[7d])) by (le)
          )
      - record: readmission_api:slo_adherent:7d
        expr: |
          (readmission_api:availability_ratio:7d >= bool 0.995)
          *
          (readmission_api:p95_latency_seconds:7d <= bool 0.5)
      - record: readmission_api:audit_coverage_ratio:5m
        expr: |
          clamp_max(
            sum(increase(readmission_audit_events_total{job="readmission-api", event=~"completed|failed"}[5m]))
            /
            sum(increase(readmission_audit_events_total{job="readmission-api", event="started"}[5m])),
            1
          )
